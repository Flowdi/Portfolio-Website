<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Projekt von Florian Dumler">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="images/logo.png" type="image/png">
  <title>Projekt — Florian Dumler</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .project-detail { min-height: calc(100vh - 76px); padding-block: clamp(4rem, 9vw, 8rem); }
    .detail-back { color: var(--muted); font: .75rem "Cascadia Code", "SFMono-Regular", Consolas, monospace; text-decoration: none; text-transform: uppercase; letter-spacing: .08em; }
    .detail-header { max-width: 980px; margin-top: 5rem; }
    .detail-header h1 { margin-bottom: 1.8rem; }
    .detail-lead { max-width: 760px; color: var(--muted); font-size: clamp(1.1rem, 2vw, 1.4rem); }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin-top: 5rem; background: var(--line); border: 1px solid var(--line); }
    .detail-panel { padding: clamp(1.5rem, 4vw, 3rem); background: var(--surface); }
    .detail-panel h2 { font-size: clamp(1.5rem, 3vw, 2.4rem); }
    .detail-panel p { color: var(--muted); }
    @media (max-width: 700px) { .detail-grid { grid-template-columns: 1fr; } }
  </style>
  <script src="projects.js" defer></script>
  <script src="project.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Zur Startseite"><span>FD</span><span class="wordmark-dot">.</span></a>
    <span></span>
    <div class="header-actions"><button class="language-toggle text-button" type="button">EN</button><button class="theme-toggle icon-button" type="button" aria-label="Helles Farbschema aktivieren">◐</button></div>
  </header>
  <main id="main" class="project-detail section-shell">
    <a class="detail-back" href="index.html#projects">← <span id="back-label">Alle Projekte</span></a>
    <article id="project-content" hidden>
      <header class="detail-header">
        <p class="eyebrow" id="project-category"></p>
        <h1 id="project-title"></h1>
        <p class="detail-lead" id="project-summary"></p>
        <ul class="project-tags" id="project-technologies"></ul>
      </header>
      <div class="detail-grid">
        <section class="detail-panel"><p class="section-index">01</p><h2 id="challenge-title">Ziel & Herausforderung</h2><p id="project-challenge"></p></section>
        <section class="detail-panel"><p class="section-index">02</p><h2 id="status-title">Aktueller Stand</h2><p id="project-status"></p></section>
      </div>
    </article>
    <section id="not-found" hidden><h1>Projekt nicht gefunden.</h1><a href="index.html#projects">Zurück zur Übersicht</a></section>
  </main>
</body>
</html>
