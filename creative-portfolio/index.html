<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Portfolio von Florian – Webentwicklung, Projekte, Skills und Zertifikate.">
<title>Florian | Webentwicklung & Portfolio</title>
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/background.css" />
<link rel="stylesheet" href="assets/css/orbit.css" />
<link rel="stylesheet" href="assets/css/boost.css" />
<link rel="stylesheet" href="assets/css/panels.base.css" />
<link rel="stylesheet" href="assets/css/panels.sections.css" />
<link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>
<div class="lang-switch" role="group" aria-label="Sprache auswählen">
  <button type="button" data-lang="de" class="active" aria-pressed="true">DE</button>
  <span aria-hidden="true">|</span>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>
<canvas id="stars" aria-hidden="true"></canvas>

<div class="orbit-container">
  <div class="orbit" id="orbit"></div>
</div>

<button class="star-button" id="starBtn" type="button" aria-label="Orbit beschleunigen">
    <canvas id="boostCore" aria-hidden="true"></canvas>
</button>
<div class="boost-hint" id="boostHint">
  Klicke auf die Sphere, um die Rotation zu beschleunigen
</div>
<div id="overlay" class="overlay" aria-hidden="true">
  <div class="overlay-inner" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1">
    <button type="button" class="overlay-close" id="overlayClose" aria-label="Dialog schließen">×</button>
    <div id="overlayBody"></div>
  </div>
</div>

<script src="js/app.bundle.js" defer></script>
</body>
</html>
