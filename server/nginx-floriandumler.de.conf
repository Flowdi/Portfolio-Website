server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name floriandumler.de www.floriandumler.de;

    root /var/www/floriandumler.de;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/floriandumler.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/floriandumler.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; frame-src 'none'; form-action 'none'; script-src 'self' 'sha256-p9ys7lxpBPqSykGB/bhqevHIjqtmZKpTHBxXGf7Al+I='; script-src-attr 'none'; style-src 'self' 'sha256-SAJY5rZIqSNhBNPaBSrizbSLF7uNeYi4mausoDHeYTQ='; style-src-attr 'none'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'self'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* \.(?:bak|conf|ini|log|sql|sqlite|sh|swp|tmp)$ {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name floriandumler.de www.floriandumler.de;
    return 301 https://$host$request_uri;
}
