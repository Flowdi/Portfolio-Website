server {
    listen 80;
    listen [::]:80;
    server_name florian-dumler.de www.florian-dumler.de;

    root /var/www/florian-dumler.de;
    index index.html;
    server_tokens off;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
